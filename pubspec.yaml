name: mipypos_native
description: MipyPOS Sistema POS Profesional Nativo
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  intl: ^0.19.0
  pdf: ^3.11.1
  path_provider: ^2.1.3
  cupertino_icons: ^1.0.8
  printing: ^5.12.0

  # Compatible con Flutter 3.24 y Android SDK 35.
  file_picker: ^8.1.2

  excel: ^2.0.0
  csv: ^6.0.0
  qr_flutter: ^4.1.0
  network_info_plus: ^6.0.0
  mobile_scanner: ^5.1.0
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/productos/
    - assets/data/