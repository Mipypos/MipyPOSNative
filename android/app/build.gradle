# Android SDK update

Updated compileSdk and targetSdk to 35 to satisfy plugin requirements.

apply plugin: 'com.android.application'

android {
    compileSdk = 35

    defaultConfig {
        applicationId "com.mipypos.app"
        minSdkVersion 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    // rest of the gradle configuration unchanged
}
